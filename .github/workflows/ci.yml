name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Restore locked dependencies
        run: dotnet restore ScreenAnnotationTool.sln --locked-mode

      - name: Verify formatting
        run: dotnet format whitespace ScreenAnnotationTool.sln --verify-no-changes --no-restore

      - name: Build and test
        run: dotnet test ScreenAnnotationTool.sln -c Release --no-restore
