name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Verify tag matches csproj version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = ([xml](Get-Content src/ScreenAnnotationTool/ScreenAnnotationTool.csproj)).Project.PropertyGroup.Version |
              Where-Object { $_ } | Select-Object -First 1
          $tag = $env:TAG.TrimStart('v')
          if ($tag -ne $version) {
              throw "Tag version '$tag' does not match csproj <Version> '$version'. Bump the csproj or retag."
          }

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Restore locked dependencies
        run: |
          dotnet restore ScreenAnnotationTool.sln --locked-mode
          dotnet restore src/ScreenAnnotationTool/ScreenAnnotationTool.csproj -r win-x64 --locked-mode

      - name: Verify formatting
        run: dotnet format whitespace ScreenAnnotationTool.sln --verify-no-changes --no-restore

      - name: Test
        run: dotnet test ScreenAnnotationTool.sln -c Release --no-restore

      - name: Build installer
        shell: pwsh
        env:
          CHALK_SIGNING_CERTIFICATE_BASE64: ${{ secrets.CHALK_SIGNING_CERTIFICATE_BASE64 }}
          CHALK_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.CHALK_SIGNING_CERTIFICATE_PASSWORD }}
        run: ./build-installer.ps1 -NoRestore

      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem dist/Chalk*.exe | Sort-Object Name | ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash *$($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt -Encoding ascii

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/ChalkSetup-*.exe
            dist/Chalk-*-portable.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/ChalkSetup-*.exe
            dist/Chalk-*-portable.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
